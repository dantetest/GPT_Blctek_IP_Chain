openapi: 3.1.0
info:
  title: BlctekIP API
  version: 0.3.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /health:
    get:
      operationId: readiness
      responses:
        '200':
          description: MySQL and Redis are ready
  /auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
        '409':
          description: Email already registered
        '422':
          description: Password does not meet policy
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
        '401':
          description: Invalid credentials
        '423':
          description: Account temporarily locked
  /auth/refresh:
    post:
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token pair rotated
  /auth/logout:
    post:
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session revoked
  /auth/verify-email:
    post:
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified
  /me:
    get:
      operationId: currentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
  /api-keys:
    get:
      operationId: listApiKeys
      security:
        - bearerAuth: []
      responses:
        '200':
          description: API keys owned by the current user
    post:
      operationId: createApiKey
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key created and returned once
        '403':
          description: Current tier cannot create API keys
        '409':
          description: API key limit or idempotency conflict
  /api-keys/{id}:
    delete:
      operationId: revokeApiKey
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: API key revoked
        '404':
          description: API key not found
  /agent/context:
    get:
      operationId: apiKeyContext
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Authenticated API key context and granted scopes
        '401':
          description: API key is invalid or expired
        '429':
          description: Monthly API key quota exceeded
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key used to replay the first deterministic response.
      schema:
        type: string
        minLength: 8
        maxLength: 160
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        display_name:
          type: string
          maxLength: 120
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    CreateApiKeyRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - datasets:read
              - orders:read
              - orders:write
              - assets:read
              - assistant:query
        expires_at:
          type:
            - string
            - 'null'
          format: date-time
