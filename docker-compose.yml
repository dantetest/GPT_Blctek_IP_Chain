services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: blctekip
      MYSQL_USER: blctekip
      MYSQL_PASSWORD: blctekip
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./apps/api
      target: runtime
    command: ["/app/migrate", "up"]
    environment:
      MYSQL_DSN: blctekip:blctekip@tcp(mysql:3306)/blctekip?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
      target: runtime
    command: ["/app/server"]
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mysql_data:
