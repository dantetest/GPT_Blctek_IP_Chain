name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: apps/api/go.mod
      - name: Resolve Go modules
        run: go mod tidy
      - name: Upload Go module metadata
        uses: actions/upload-artifact@v4
        with:
          name: api-go-module-metadata
          path: |
            apps/api/go.mod
            apps/api/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run go vet
        id: vet
        continue-on-error: true
        shell: bash
        run: set -o pipefail; go vet ./... 2>&1 | tee vet.log
      - name: Upload vet diagnostics
        if: steps.vet.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: api-vet-log
          path: apps/api/vet.log
      - name: Fail on vet diagnostics
        if: steps.vet.outcome == 'failure'
        run: exit 1
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
