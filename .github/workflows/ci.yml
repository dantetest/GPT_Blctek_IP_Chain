name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: |
            apps/api/go.mod
            apps/api/go.sum
      - name: Resolve Go module metadata
        id: modules
        continue-on-error: true
        shell: bash
        run: |
          go mod tidy
          git diff -- go.mod go.sum | tee module-metadata.diff
          test ! -s module-metadata.diff
      - name: Upload module diagnostics
        if: steps.modules.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: api-module-diagnostics
          path: |
            apps/api/go.mod
            apps/api/go.sum
            apps/api/module-metadata.diff
      - name: Fail on module drift
        if: steps.modules.outcome == 'failure'
        run: exit 1
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Run go vet
        run: go vet ./...
      - name: Run race tests
        run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
